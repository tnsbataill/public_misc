[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "msproject-mcp"
version = "0.1.0"
description = "Model Context Protocol server for Microsoft Project 2021 (MSPDI XML files or live COM automation)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2"]

[project.optional-dependencies]
com = ["pywin32>=306; sys_platform == 'win32'"]
dev = ["pytest>=7"]

[project.scripts]
msproject-mcp = "msproject_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/msproject_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
